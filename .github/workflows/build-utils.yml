name: Build utils

on:
  push:
    branches: [ "main", "ci" ]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite"
      vcpkg_cache_dir: "${{ github.workspace }}/vcpkg_binary_cache"

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        include:
          - os: macos-latest
            # cmake_extra_flags: "-D CMAKE_OSX_ARCHITECTURES='arm64;x86_64'"
          - os: windows-latest
            bin_ext: ".exe"
            cmake_extra_flags: "-D CMAKE_MSVC_RUNTIME_LIBRARY='MultiThreaded$<$<CONFIG:Debug>:Debug>' -D VCPKG_OVERLAY_TRIPLETS=x64-windows-static"
          - os: ubuntu-latest
        #c_compiler: [gcc, clang, cl]

    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    
    - name: Cache deps built with vcpkg
      uses: actions/cache@v4
      with:
        path: ${{ env.vcpkg_cache_dir }}
        key: vcpkg-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      run: |
        echo "build_dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        mkdir -p "${vcpkg_cache_dir}"

        cmake -S '${{ github.workspace }}' -G Ninja
        -B '${{ steps.strings.outputs.build_dir }}'
        -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -D CMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
        ${{ matrix.cmake_extra_flags }}

    - name: Build and install
      run: |
        cd "${{ steps.strings.outputs.build_dir }}"
        cmake --build .
        cpack

    - uses: actions/upload-artifact@v4
      with:
        name: camera-utils-${{ github.sha }}-${{ runner.os }}_${{ runner.arch }}
        path: |
          ${{ steps.strings.outputs.build_dir }}/*.tar.*
